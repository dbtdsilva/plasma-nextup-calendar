name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Run logic tests
        run: node --test tests/eventlogic.test.js

      - name: Validate metadata.json is valid JSON
        run: python3 -c "import json; json.load(open('package/metadata.json'))"

      - name: Validate config/main.xml is well-formed
        run: python3 -c "import xml.dom.minidom; xml.dom.minidom.parse('package/contents/config/main.xml')"

      - name: Check SPDX headers on sources
        run: |
          missing=$(grep -RL "SPDX-License-Identifier" --include='*.qml' --include='*.js' --include='*.xml' package/contents || true)
          if [ -n "$missing" ]; then
            echo "::error::sources missing SPDX-License-Identifier:"
            echo "$missing"
            exit 1
          fi
          echo "SPDX headers present on all sources"

  validate:
    runs-on: ubuntu-latest
    # GitHub's ubuntu-latest runner is 24.04, which ships Plasma 5 / KF5 (no
    # kpackagetool6, no Qt6 Kirigami). Run in an ubuntu:26.04 container — it has
    # the full Plasma 6 / Qt6 / KF6 stack, matching the versions the widget
    # targets, so qmllint resolves every import and kpackagetool6 exists.
    container: ubuntu:26.04
    env:
      DEBIAN_FRONTEND: noninteractive
      LC_ALL: C.UTF-8
    steps:
      # Install before checkout so git is present for actions/checkout.
      # --no-install-recommends stays lean; plasma-workspace's hard deps already
      # provide the org.kde.plasma.* QML plugins qmllint needs.
      - name: Install Plasma 6 toolchain
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git ca-certificates \
            qt6-declarative-dev-tools \
            qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-layouts \
            qml6-module-org-kde-kirigami \
            plasma-workspace kpackagetool6

      - name: Checkout
        uses: actions/checkout@v6

      - name: Lint QML
        run: |
          export PATH="/usr/lib/qt6/bin:$PATH"
          qmllint package/contents/ui/*.qml package/contents/config/config.qml

      - name: Validate plasmoid package
        run: kpackagetool6 --type Plasma/Applet --install package --packageroot "$(mktemp -d)"
